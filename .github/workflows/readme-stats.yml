name: Update README Stats

on:
  schedule:
    - cron: "0 0 1 * *"  # 每月1号的00:00 UTC执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Stats
        run: |
          mkdir -p imgs
          set -euo pipefail
          BASE_URL="https://lencx-stats.vercel.app/api"
          USERNAME="${{ github.repository_owner }}"
          
          curl --fail --retry 3 --retry-delay 5 \
            "${BASE_URL}?username=${USERNAME}&locale=en&theme=default" \
            -o imgs/stats-en-light.svg
          curl --fail --retry 3 --retry-delay 5 \
            "${BASE_URL}?username=${USERNAME}&locale=en&theme=dark" \
            -o imgs/stats-en-dark.svg
          curl --fail --retry 3 --retry-delay 5 \
            "${BASE_URL}?username=${USERNAME}&locale=cn&theme=default" \
            -o imgs/stats-cn-light.svg
          curl --fail --retry 3 --retry-delay 5 \
            "${BASE_URL}?username=${USERNAME}&locale=cn&theme=dark" \
            -o imgs/stats-cn-dark.svg

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add imgs/*.svg || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update stats (multi-language & theme)"
            git push
          else
            echo "No changes to commit"
          fi
